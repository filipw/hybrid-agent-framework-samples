name: Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      matrix:
        os: [macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Create virtual environment
        shell: bash
        run: |
          if [ -d ".venv" ]; then
            echo "WARNING: .venv already exists – skipping creation"
          else
            python -m venv .venv
          fi

      - name: Install Python dependencies
        working-directory: python
        shell: bash
        run: |
          VENV_PYTHON="../.venv/bin/python"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            VENV_PYTHON="../.venv/Scripts/python"
          fi
          "$VENV_PYTHON" -m pip install --quiet --upgrade pip
          if [[ "$(uname -m)" == "arm64" ]]; then
            "$VENV_PYTHON" -m pip install --quiet -r requirements.txt
          else
            echo "  (non-Apple-Silicon platform — skipping agent-framework-mlx)"
            grep -v 'agent-framework-mlx' requirements.txt \
              | "$VENV_PYTHON" -m pip install --quiet -r /dev/stdin
          fi

      - name: Python syntax check
        working-directory: python
        shell: bash
        run: |
          VENV_PYTHON="../.venv/bin/python"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            VENV_PYTHON="../.venv/Scripts/python"
          fi
          find . -name "*.py" -not -path ".venv/*" \
            | xargs "$VENV_PYTHON" -m py_compile
          echo "Syntax OK"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: .NET restore & build
        working-directory: dotnet
        shell: bash
        run: |
          dotnet build HybridAgentDemos.slnx \
            --configuration Release \
            --nologo \
            -v minimal
